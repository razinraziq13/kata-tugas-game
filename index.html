<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Kata Ganda</title>
<style>
body {
  font-family: 'Comic Sans MS', Arial, sans-serif;
  background: linear-gradient(to right, #ffecd2, #fcb69f);
  text-align: center;
  min-height: 100vh;
  margin: 0;
  padding: 0;
  background-image: url('https://i.imgur.com/7M2eP3g.png'); /* Contoh background kartun */
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
}
.game-box {
  background: rgba(255, 255, 255, 0.9);
  width: 450px;
  margin: 30px auto;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 0 15px rgba(0,0,0,0.2);
}
button {
  width: 100%;
  margin: 8px 0;
  padding: 12px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #ff6f61;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}
button:hover { background: #ff3b2f; }
.correct { background: #2ecc71 !important; }
.wrong { background: #e74c3c !important; }

h2, h3, p {
  text-shadow: 1px 1px 2px #fff;
}
.obj {
  text-align: left;
  margin-bottom: 15px;
  font-style: italic;
  color: #333;
}
</style>
</head>
<body>

<div class="game-box">
<h2>Game Kata Ganda</h2>

<div class="obj">
<p><strong>Objektif Pembelajaran:</strong></p>
<ol>
<li>Memahami kata ganda separa tunggal dan separa berimbuhan dalam pelbagai ayat.</li>
<li>Menggunakan kata ganda separa tunggal dan separa berimbuhan dengan betul dalam ayat.</li>
</ol>
</div>

<p id="question"></p>

<button onclick="answer(0)" id="btn0"></button>
<button onclick="answer(1)" id="btn1"></button>
<button onclick="answer(2)" id="btn2"></button>

<h3>Skor: <span id="score">0</span></h3>
</div>

<script>
const questions = [
  {q:"Pilih ayat yang menggunakan kata ganda separa tunggal dengan betul.", 
   a:["Budak itu comel-comel sahaja.","Budak itu comel-comelnya.","Budak itu sangat comel."], 
   c:0, f:"Betul! 'comel-comel' adalah kata ganda separa tunggal."},

  {q:"Pilih ayat yang menggunakan kata ganda separa berimbuhan dengan betul.", 
   a:["Ali berlari-lari di taman.","Ali lari-lari di taman.","Ali sedang berlari."], 
   c:0, f:"Betul! 'berlari-lari' adalah kata ganda separa berimbuhan."},

  {q:"Lengkapkan ayat dengan kata ganda: 'Adik sedang ___ main di halaman.'", 
   a:["lari-lari","bermain","main-main"], 
   c:0, f:"Betul! Kata ganda 'lari-lari' sesuai."},

  {q:"Pilih ayat yang paling sesuai:", 
   a:["Ibu masak-memasak di dapur setiap pagi.","Ibu memasak setiap pagi.","Ibu masak di dapur."], 
   c:0, f:"Betul! 'masak-memasak' adalah kata ganda separa berimbuhan."},

  {q:"Pilih ayat yang menggunakan kata ganda separa tunggal dengan betul.", 
   a:["Rumah itu besar-besar belaka.","Rumah itu besarnya besar.","Rumah itu sangat besar."], 
   c:0, f:"Betul! 'besar-besar' adalah kata ganda separa tunggal."}
];

let index = 0;
let score = 0;

function loadQuestion(){
  const q = questions[index];
  document.getElementById("question").innerText = q.q;
  q.a.forEach((text,i)=>{
    document.getElementById("btn"+i).innerText = text;
    document.getElementById("btn"+i).className="";
  });
}

function answer(choice){
  const correct = questions[index].c;
  const feedback = questions[index].f;
  if(choice===correct){
    score++;
    document.getElementById("score").innerText = score;
    document.getElementById("btn"+choice).classList.add("correct");
  } else {
    document.getElementById("btn"+choice).classList.add("wrong");
    document.getElementById("btn"+correct).classList.add("correct");
  }
  setTimeout(()=>{
    index++;
    if(index<questions.length){
      loadQuestion();
    } else {
      alert("Game Tamat! Skor anda: "+score);
      index=0; score=0; document.getElementById("score").innerText=score;
      loadQuestion();
    }
  },800);
}

loadQuestion();
</script>

</body>
</html>
