<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Kata Tugas</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f8ff;
  text-align: center;
}
.game-box {
  background: white;
  width: 400px;
  margin: 30px auto;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
  font-size: 16px;
  border: none;
  border-radius: 6px;
  background: #4a90e2;
  color: white;
  cursor: pointer;
}
button:hover { background: #357abd; }
.correct { background: #2ecc71 !important; }
.wrong { background: #e74c3c !important; }
</style>
</head>
<body>

<div class="game-box">
<h2>Game Kata Tugas</h2>
<p id="question"></p>

<button onclick="answer(0)" id="btn0"></button>
<button onclick="answer(1)" id="btn1"></button>
<button onclick="answer(2)" id="btn2"></button>

<h3>Skor: <span id="score">0</span></h3>
</div>

<script>
const questions = [
  {q:"Pilih ayat yang menggunakan kata nafi dengan betul.", a:["Ali ialah tidak hadir ke sekolah hari ini.","Ali bukan hadir ke sekolah hari ini.","Ali tidak hadir ke sekolah hari ini."], c:2, f:"Betul! Ini kata nafi."},
  {q:"Apakah fungsi kata pemeri dalam ayat “Cikgu Farah ialah guru Bahasa Melayu”?", a:["Menegaskan","Menghubungkan subjek dengan predikat","Menunjukkan masa"], c:1, f:"Betul! Kata pemeri menghubungkan subjek dan predikat."},
  {q:"Pilih ayat yang menggunakan kata penegas dengan betul.", a:["Tolonglah kamu tutup pintu itu.","Tolong kamu tutup pintu itu lah.","Tolong kamu lah tutup pintu itu."], c:0, f:"Betul! Kata penegas '-lah' digunakan."},
  {q:"Pilih ayat yang paling sesuai mengikut konteks.", a:["Kami sedang ke sekolah semalam.","Kami telah ke sekolah pagi tadi.","Kami akan ke sekolah kelmarin."], c:1, f:"Betul! Kata bantu 'telah' digunakan dengan betul."},
  {q:"Lengkapkan ayat dengan kata arah: Buku itu diletakkan ___ meja.", a:["dari","atas","kepada"], c:1, f:"Betul! Kata arah 'atas' sesuai."},
  {q:"Pilih ayat yang menggunakan kata bilangan dengan betul.", a:["Banyak murid itu sedang beratur.","Setiap murid itu sedang beratur.","Setiap murid sedang beratur."], c:2, f:"Betul! Kata bilangan 'Setiap' digunakan."},
  {q:"Pilih ayat yang menggunakan kata penguat dengan betul.", a:["Rumah itu sungguh besar sekali.","Rumah itu sangat besar.","Rumah itu besar sangat sekali."], c:1, f:"Betul! Kata penguat 'sangat' digunakan."},
  {q:"Apakah fungsi kata penekan dalam ayat 'Sesungguhnya kejayaan itu memerlukan usaha'?", a:["Memberi penegasan terhadap keseluruhan ayat","Menyatakan masa","Menunjukkan arah"], c:0, f:"Betul! Kata penekan menegaskan ayat."},
  {q:"Pilih ayat yang mengandungi kata pembenda.", a:["Dia rajin belajar setiap hari.","Kejayaannya hasil usaha gigih.","Dia belajar dengan rajin."], c:1, f:"Betul! Kata pembenda '-nya' digunakan."},
  {q:"Pilih ayat yang paling gramatis dan sesuai.", a:["Adik sedang telah membaca buku itu.","Adik akan membaca buku itu semalam.","Adik sedang membaca buku itu."], c:2, f:"Betul! Kata bantu 'sedang' digunakan dengan betul."}
];

let index = 0;
let score = 0;

function loadQuestion(){
  const q = questions[index];
  document.getElementById("question").innerText = q.q;
  q.a.forEach((text,i)=>{
    document.getElementById("btn"+i).innerText = text;
    document.getElementById("btn"+i).className="";
  });
}

function answer(choice){
  const correct = questions[index].c;
  const feedback = questions[index].f;
  if(choice===correct){
    score++;
    document.getElementById("score").innerText = score;
    document.getElementById("btn"+choice).classList.add("correct");
  } else {
    document.getElementById("btn"+choice).classList.add("wrong");
    document.getElementById("btn"+correct).classList.add("correct");
  }
  setTimeout(()=>{
    index++;
    if(index<questions.length){
      loadQuestion();
    } else {
      alert("Game Tamat! Skor anda: "+score);
      index=0; score=0; document.getElementById("score").innerText=score;
      loadQuestion();
    }
  },800);
}

loadQuestion();
</script>

</body>
</html>
